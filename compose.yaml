services:
  intelligence-mcp:
    image: flamoris-intelligence-mcp:local
    build: .
    # Linux Docker Engine: retain loopback-only MCP and reach host llama.cpp.
    # No published ports and no broad application bind.
    network_mode: host
    env_file: .env
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
