name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      - run: python -m build
      - name: Installed wheel smoke
        shell: bash
        run: |
          python -m venv /tmp/intelligence-wheel
          /tmp/intelligence-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/intelligence-wheel/bin/flamoris-intelligence-mcp --help
          /tmp/intelligence-wheel/bin/python -c 'from flamoris_intelligence_mcp.server import create_server; assert create_server()'
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r docker-requirements.txt
      - name: Build and start read-only non-root image without a provider
        shell: bash
        run: |
          cp .env.example .env
          # Non-default port/path exercises env_file -> Settings -> healthcheck.
          cat >> .env <<'EOF'
          FLAMORIS_INTELLIGENCE_HTTP_PORT=18767
          FLAMORIS_INTELLIGENCE_MCP_PATH=/ci/intelligence
          FLAMORIS_INTELLIGENCE_PROVIDER_URL=http://127.0.0.1:1
          EOF
          docker compose config --quiet
          docker compose build
          docker compose up -d --wait --wait-timeout 90
      - name: Verify runtime isolation and installed package
        shell: bash
        run: |
          docker compose exec -T intelligence-mcp python - <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          assert os.getuid() == 10001
          for name in ('pytest', 'ruff', 'build', 'hatchling', 'torch'):
              assert importlib.util.find_spec(name) is None, name
          assert not Path('/wheels').exists()
          assert not Path('/app/.env').exists()
          try:
              Path('/app/write-probe').touch()
          except OSError:
              pass
          else:
              raise AssertionError('runtime filesystem must be read-only')
          PY
          docker compose exec -T intelligence-mcp flamoris-intelligence-mcp --help
          docker compose exec -T intelligence-mcp python -m flamoris_intelligence_mcp.healthcheck
          python examples/smoke.py --url http://127.0.0.1:18767/ci/intelligence --discovery-only
      - name: Restart and repeat protocol smoke
        run: |
          docker compose restart
          docker compose up -d --wait --wait-timeout 90
          python examples/smoke.py --url http://127.0.0.1:18767/ci/intelligence --discovery-only
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Cleanup
        if: always()
        run: docker compose down
